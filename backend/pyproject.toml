[project]
name = "eka-backend"
version = "0.1.0"
description = "Enterprise Knowledge Assistant: API, RAG pipeline and ingestion worker"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "anthropic>=1.15",
    "argon2-cffi>=25.1",
    "boto3>=1.43",
    "celery[redis]>=5.6",
    "email-validator>=2.3",
    "fastapi>=0.143",
    "httpx>=0.28",
    "pgvector>=0.5",
    "prometheus-client>=0.26",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pypdf[crypto]>=6.21",
    "python-docx>=1.2",
    "python-multipart>=0.0.32",
    "redis>=5.2",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54",
]

[project.optional-dependencies]
# Local embedding + cross-encoder models. Pulls torch, so it is opt-in.
local-models = [
    "sentence-transformers>=6.1",
    "torch>=2.14",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.2",
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-cov>=7.0",
    "reportlab>=5.0",
    "ruff>=0.17",
]

[tool.uv]
# Use the interpreter already installed on the machine; never download one.
python-downloads = "never"

# CPU-only torch wheels on Linux (Docker/CI) instead of the multi-GB CUDA build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N"]
ignore = [
    "B008",   # FastAPI Depends()/Query() in argument defaults is idiomatic
    "S311",   # random is not used for security
    "RUF012", # mutable class attrs are fine on pydantic/sqlalchemy models
]

[tool.ruff.lint.isort]
# backend/alembic/ holds migration scripts; the `alembic` package is third-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "N802"]
"eval/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL (docker compose up -d postgres redis)",
    "slow: loads real ML models",
]
filterwarnings = ["ignore::DeprecationWarning:celery.*"]
